name: Cluster Detector

on:
  pull_request_target:
    branches: [main]
    # Re-run on head updates and base retargets. This workflow is advisory.
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cluster-detector-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cluster-detector:
    name: Trusted Cluster Policy Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Capture live pull request snapshot
        id: pr-snapshot
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SNAPSHOT="${RUNNER_TEMP}/cluster-advisory-pr.json"
          gh api "repos/${REPO}/pulls/${PR_NUMBER}" > "$SNAPSHOT"

          LIVE_HEAD_SHA=$(jq -er '.head.sha' "$SNAPSHOT")
          LIVE_BASE_SHA=$(jq -er '.base.sha' "$SNAPSHOT")
          LIVE_BASE_REF=$(jq -er '.base.ref | if type == "string" and . != "" then . else error("invalid .base.ref") end' "$SNAPSHOT")
          LIVE_BASE_REPO=$(jq -er '.base.repo.full_name | if type == "string" and . != "" then . else error("invalid .base.repo.full_name") end' "$SNAPSHOT")
          if ! [[ "$LIVE_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid live pull request head SHA"
            exit 1
          fi
          if ! [[ "$LIVE_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid live pull request base SHA"
            exit 1
          fi
          if [ "$LIVE_BASE_REF" != "main" ] || [ "$LIVE_BASE_REPO" != "$REPO" ]; then
            echo "::notice::Cluster advisory no longer applies to this pull request base"
            {
              echo "## Sensitive-area advisory"
              echo
              echo "This evaluation was skipped because the pull request no longer targets this repository's main branch."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$LIVE_HEAD_SHA" != "$EVENT_HEAD_SHA" ]; then
            echo "::notice::Cluster advisory superseded by a newer pull request head"
            {
              echo "## Sensitive-area advisory"
              echo
              echo "This evaluation was superseded by a newer pull request head."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "path=${SNAPSHOT}"
            echo "base_sha=${LIVE_BASE_SHA}"
            echo "superseded=false"
          } >> "$GITHUB_OUTPUT"

      # Run policy only from the trusted live base commit. Pull-request content
      # is inspected through read-only GitHub API data and is never executed.
      - name: Checkout trusted cluster policy
        if: steps.pr-snapshot.outputs.superseded != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          path: .cluster-policy
          persist-credentials: false
          ref: ${{ steps.pr-snapshot.outputs.base_sha }}

      - name: Verify trusted cluster policy checkout
        if: steps.pr-snapshot.outputs.superseded != 'true'
        env:
          EXPECTED_BASE_SHA: ${{ steps.pr-snapshot.outputs.base_sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git -C .cluster-policy rev-parse HEAD)
          if [ "$CHECKED_OUT_SHA" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::Trusted cluster policy checkout does not match the live base SHA"
            exit 1
          fi

      - name: Check sensitive area changes and cluster window
        id: cluster-check
        if: steps.pr-snapshot.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SNAPSHOT: ${{ steps.pr-snapshot.outputs.path }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CLUSTER_THRESHOLD=3
          WINDOW_DAYS=14
          SINCE_DATE=$(date -d "${WINDOW_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)

          RESULT=$(node .cluster-policy/scripts/check-cluster-scope.mjs \
            --snapshot "$PR_SNAPSHOT" \
            --repo "$REPO" \
            --since "$SINCE_DATE" \
            --threshold "$CLUSTER_THRESHOLD")

          SENSITIVE_HIT=$(printf '%s' "$RESULT" | jq -er '.sensitive | if type == "boolean" then tostring else error("invalid .sensitive") end')
          VIOLATION=$(printf '%s' "$RESULT" | jq -er '.violation | if type == "boolean" then tostring else error("invalid .violation") end')
          VIOLATION_REASON=$(printf '%s' "$RESULT" | jq -er '.reason | if type == "string" then . else error("invalid .reason") end')
          case "$VIOLATION_REASON" in
            ""|bundle|window) ;;
            *)
              echo "::error::Invalid cluster advisory reason"
              exit 1
              ;;
          esac

          {
            echo "sensitive_hit=${SENSITIVE_HIT}"
            echo "violation=${VIOLATION}"
            echo "violation_reason=${VIOLATION_REASON}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish cluster advisory
        if: steps.pr-snapshot.outputs.superseded != 'true'
        env:
          REASON: ${{ steps.cluster-check.outputs.violation_reason }}
          VIOLATION: ${{ steps.cluster-check.outputs.violation }}
        run: |
          set -euo pipefail
          if [ "$VIOLATION" = "true" ]; then
            printf '::warning::Sensitive-area cluster advisory (%s): review architecture, critique, and security impacts before merging.\n' "$REASON"
            {
              echo "## Sensitive-area advisory"
              echo
              echo "This pull request touches a sensitive area and meets the cluster threshold."
              printf '%s\n' "- Detector reason: ${REASON}"
              echo "- Owner action: review architecture, critique, and security impacts before merge."
              echo
              echo "This advisory never requires a label, attestation, collaborator, or additional merge approval."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Sensitive-area advisory"
              echo
              echo "No sensitive-area cluster advisory was detected."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
