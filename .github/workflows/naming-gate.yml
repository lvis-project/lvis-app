name: Naming Gate (process-metadata + de-identification)

# 두 개의 독립 job:
#
# 1. naming-gate — 식별자/파일명에 process-derived 메타데이터(H1/H2, Phase-N,
#    mock-/fake- prefix, Tier-as-process audit key, version-suffix, PR-number
#    fixture path)가 새로 추가되지 못하도록 차단한다. 규칙 원문(positive form)은
#    `AGENTS.md` > `Naming`.
#
# 2. deidentification-gate — 이 저장소는 PUBLIC 이다. 고용사 브랜드명, 사내
#    시스템명, 사내 호스트명이 새로 추가되지 못하도록 차단한다. 사내 구현은
#    private 플러그인 저장소에 남는다는 경계가 이미 설계로 존재하며, 공개
#    호스트 저장소에 사내 식별자가 들어오면 그 경계가 무의미해진다.
#
# 두 job 모두 diff-based: PR 의 변경분만 검사한다. 기존 위반은 grandfather;
# sweep PR 으로 별도 제거. 이 gate 는 *새 callsite 차단* 이 목적.
#
# naming-gate 가 검사하지 *않는* 것은 `AGENTS.md` > `Naming` 이 reviewer 규칙으로
# 명시한다. grep 이 도메인 의미와 process 의미를 구분할 수 없는 단어는 패턴에서
# 빼고 규칙 문서에 남긴다 — 저자가 grep 과 말싸움하게 만들지 않기 위해서다.

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  naming-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute diff vs base
        id: diff
        run: |
          base_sha=$(git merge-base origin/${{ github.base_ref }} HEAD)
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          exclude_re='^(docs/blueprints/|docs/ko/|\.github/|.*/__tests__/|.*/__mocks__/|test/|tests/|.*\.test\.|.*\.spec\.|.*\.lock|.*lock\.json|CHANGELOG)'
          include_re='\.(ts|tsx|py|js|mjs|cjs|md)$'
          # Content check: every changed file except DELETED ones (--diff-filter=d).
          # A deletion cannot introduce a prohibited identifier.
          git diff --name-only --diff-filter=d "$base_sha"...HEAD \
            | grep -Ev "$exclude_re" \
            | grep -E "$include_re" > /tmp/changed.txt || true
          # Filename check: ADDED and RENAMED files only (--diff-filter=AR).
          # A file name is decided once, when the path first appears. Re-checking
          # it on every later edit turns a grandfathered name into a permanent
          # ban on touching that file at all — `docs/architecture/session-model-v2.md`
          # is exactly that case in this tree. `R` is kept so a rename INTO a
          # prohibited name is still caught.
          git diff --name-only --diff-filter=AR "$base_sha"...HEAD \
            | grep -Ev "$exclude_re" \
            | grep -E "$include_re" > /tmp/added.txt || true
          echo "changed files:"
          cat /tmp/changed.txt
          echo "added/renamed files:"
          cat /tmp/added.txt

      - name: Grep diff for prohibited identifiers
        run: |
          base_sha="${{ steps.diff.outputs.base_sha }}"
          violations=0

          if [ ! -s /tmp/changed.txt ] && [ ! -s /tmp/added.txt ]; then
            echo "no production-path file changes — skipping."
            exit 0
          fi

          # Review-round R is matched only with a hyphen (`R-2`) so domain
          # risk-register ids (`R1`..`R8` in threat tables) are spared, and
          # D-decision only with a colon (`D5:`) so bare `D1` identifiers and hex
          # are spared. Permanent anchors (`#NNN` issue refs, `§9.6` architecture
          # section refs) are intentionally NOT flagged: they resolve against a
          # document the repository ships, which is what makes a label domain
          # rather than process.
          #
          # `H[1-9]` is case-sensitive on purpose. HTML heading vocabulary in
          # this tree is lowercase (`<h2`, 192 uses; zero uppercase `H2`), so it
          # needs no carve-out.
          #
          # Test-double words: only `mock` and `fake` are matched as identifiers.
          # `real` and `stub` are ordinary domain vocabulary here and are
          # deliberately NOT matched:
          #   * `real*` is the result of POSIX `realpath` — `realRoot`, `realDir`,
          #     `realFile`, `realParent`, `realAsset` (13 sites).
          #   * `stub*` is a compaction stub, the placeholder that replaces
          #     dropped content — `src/shared/tool-result-stub.ts`,
          #     `BOUNDARY_STUB_TEMPLATE` (12 sites).
          # Those two produced only false positives and never a true one: the old
          # pattern was anchored on a lowercase first letter, so it could not
          # match `RealCloudMarketplaceFetcher` / `MockMarketplaceFetcher`, the
          # class names the rule was written for. `mock`/`fake` now match both
          # spellings and have zero legitimate production uses. A lone `Real*`
          # identifier with no double beside it is a reviewer rule, not a gate
          # rule — see `AGENTS.md` > `Naming` > `Test doubles`.
          patterns=(
            '\bH[1-9][0-9]?\b'
            '\bR-[1-9][0-9]?\b'
            '\bD[0-9]+:'
            '\bF-round\b'
            '\bPR-[A-Z][0-9]+\b'
            '\bPR#[0-9]+'
            '§M[1-9][0-9]?\b'
            '\b(MEDIUM|HIGH|CRITICAL|LOW)-[1-9][0-9]?\b'
            '\b[pP]hase[ -]?[0-9]+[a-z]?\b'
            '\bSprint [0-9A-Z]'
            '\bWave [0-9A-Z]'
            '\bW[0-9]\.[0-9]\b'
            '\b[rR]ound[0-9]+\b'
            '\b[tT]ier[0-9]+-(bypass|skip|excluded|ignored)'
            '\bpr[0-9]{3,}\b'
            '^\+.*\b[Mm]ock[A-Z][A-Za-z0-9]*\b'
            '^\+.*\b[Ff]ake[A-Z][A-Za-z0-9]*\b'
          )

          # Added lines of one file, as the patterns see them.
          #
          # In Markdown a backticked span is a *mention*, not a use: the rule
          # document has to be able to write `H2` and `Phase 2b` to say they are
          # banned, and a doc naming a badly-named path quotes it rather than
          # creating it. Inline code spans are therefore stripped from `.md`
          # before matching. Prose outside backticks is still matched, so a bare
          # `Phase 2` in a sentence is still a violation. Nothing is stripped
          # from code files, where backticks are template literals and their
          # contents are ordinary program text.
          added_lines() {
            if [ "${1##*.}" = "md" ]; then
              git diff "$base_sha"...HEAD -- "$1" | grep -E "^\+" | sed 's/`[^`]*`//g'
            else
              git diff "$base_sha"...HEAD -- "$1" | grep -E "^\+"
            fi
          }

          for pattern in "${patterns[@]}"; do
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              [ ! -f "$file" ] && continue
              if added_lines "$file" | grep -Pn "$pattern" > /tmp/hits.txt; then
                if [ -s /tmp/hits.txt ]; then
                  echo "::error file=$file::process-metadata pattern '$pattern' added"
                  cat /tmp/hits.txt
                  violations=$((violations + $(wc -l < /tmp/hits.txt)))
                fi
              fi
            done < /tmp/changed.txt
          done

          # filename-level checks — added and renamed files only
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            base=$(basename "$file")
            dir=$(dirname "$file")
            ext="${base##*.}"
            if echo "$base" | grep -qE '^(real|mock|fake|stub)-'; then
              # A test-double prefix in a production path names the file for what
              # it is NOT. It is allowed only when the prefix is the domain word —
              # a deliberately simulated implementation the product ships — and
              # then the file says so in its first 30 lines with a `Why <prefix>:`
              # header. No file in this tree carries one; the hatch exists so a
              # genuine simulation does not have to argue with this gate.
              if ! head -30 "$file" 2>/dev/null | grep -qE 'Why (real|mock|fake|stub):'; then
                echo "::error file=$file::new $base prefix in production path without 'Why <prefix>:' header justification"
                violations=$((violations + 1))
              fi
            fi
            if echo "$base" | grep -qE '\-v[0-9]+\.(ts|tsx|py|md)$'; then
              # A version suffix records WHEN the file was written unless the
              # earlier version is a live sibling beside it — only then does `-v2`
              # say which of two parallel implementations this is.
              stem=$(echo "$base" | sed -E "s/-v[0-9]+\.${ext}\$//")
              sibling=""
              if [ -f "$dir/$stem.$ext" ]; then
                sibling="$dir/$stem.$ext"
              else
                for cand in "$dir/$stem"-v[0-9]*."$ext"; do
                  if [ -f "$cand" ] && [ "$cand" != "$file" ]; then
                    sibling="$cand"
                    break
                  fi
                done
              fi
              if [ -n "$sibling" ]; then
                echo "note: $file keeps its version suffix — earlier sibling $sibling is live"
              else
                echo "::error file=$file::version-suffix filename with no earlier sibling in $dir — the suffix records when it was written, not what it is; use a behavior-based name"
                violations=$((violations + 1))
              fi
            fi
          done < /tmp/added.txt

          if [ "$violations" -gt 0 ]; then
            echo ""
            echo "::error::naming-gate found $violations process-metadata violation(s)."
            echo "See AGENTS.md > Naming for the rule and the conversion guide."
            exit 1
          fi

          echo "naming-gate: clean."

  deidentification-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute diff vs base
        id: diff
        run: |
          base_sha=$(git merge-base origin/${{ github.base_ref }} HEAD)
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          # Scope: every path that ships publicly. Unlike naming-gate this job
          # does NOT exclude tests, docs, or .github — every leak this gate was
          # written for lived in exactly those paths.
          #
          # The one exclusion is this workflow itself: a gate that greps for a
          # literal cannot avoid containing that literal, so scanning its own
          # added lines would fail every PR that edits the gate.
          #
          # Each stage is status-checked separately. `|| true` on this pipeline
          # would make a broken filter look identical to "nothing in scope", and
          # the gate would then wave every PR through while still reporting green.
          if git diff --name-only --diff-filter=d "$base_sha"...HEAD > /tmp/deident-all.txt
          then :; else
            echo "::error::git diff failed — gate cannot verify this PR"; exit 1
          fi

          if grep -E '^(src/|test/|docs/|web/|\.github/)' /tmp/deident-all.txt > /tmp/deident-scoped.txt
          then :; else
            status=$?
            [ "$status" -ge 2 ] && { echo "::error::scope filter failed (exit $status)"; exit 1; }
            : > /tmp/deident-scoped.txt
          fi

          if grep -Fxv '.github/workflows/naming-gate.yml' /tmp/deident-scoped.txt > /tmp/deident-changed.txt
          then :; else
            status=$?
            [ "$status" -ge 2 ] && { echo "::error::self-exclusion filter failed (exit $status)"; exit 1; }
            : > /tmp/deident-changed.txt
          fi
          echo "changed files in scope:"
          cat /tmp/deident-changed.txt

      - name: Grep diff for employer-identifying content
        run: |
          base_sha="${{ steps.diff.outputs.base_sha }}"
          violations=0

          if [ ! -s /tmp/deident-changed.txt ]; then
            echo "no in-scope file changes — skipping."
            exit 0
          fi

          # Every pattern matches a WHOLE identifier or a real hostname, never a
          # bare substring. `lg` alone is deliberately absent: Tailwind emits it
          # constantly (`rounded-lg`, `text-lg`, `lg:col-span-3`) and it also sits
          # inside ordinary words (`bulge`, `divulge`). The brand pattern requires
          # the full three-letter token delimited by non-alphanumerics, and the
          # bare-`LG` pattern is upper-case only, so no lower-case Tailwind class
          # can reach either of them.
          #
          # POSIX ERE only — no `-P`. PCRE is not available in every grep build,
          # and a grep that rejects its own flag exits non-zero, which an
          # `if grep ...` would read as "no match" and let the PR through.
          # Word edges are spelled out as `[^A-Za-z0-9]` rather than `\b` for the
          # same reason.
          #
          # Text patterns are applied to ADDED lines only, on text files only.
          # Binary additions (screenshots) are covered by the filename pass below.
          patterns=(
            '(^|[^A-Za-z0-9])[Ll][Gg][Ee]([^A-Za-z0-9]|$)'
            '(^|[^A-Za-z0-9])LG([^A-Za-z0-9]|$)'
            'LG *전자'
            '[Ll][Gg][ -]?[Ee]lectronics'
            '[Ll][Gg]enie'
            '(^|[^A-Za-z0-9])the HR system([^A-Za-z0-9]|$)'
            'portal-sso'
            '포털'
          )

          if grep -E '\.(ts|tsx|js|mjs|cjs|py|md|json|ya?ml|sh|txt|html|css)$|Dockerfile$' \
            /tmp/deident-changed.txt > /tmp/deident-text.txt
          then :; else
            status=$?
            [ "$status" -ge 2 ] && { echo "::error::text-file filter failed (exit $status)"; exit 1; }
            : > /tmp/deident-text.txt
          fi

          for pattern in "${patterns[@]}"; do
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              [ ! -f "$file" ] && continue
              # `if ...; then` keeps errexit from aborting the step on the
              # expected exit 1 (no match), while still exposing the status.
              if git diff "$base_sha"...HEAD -- "$file" | grep -E "^\+" \
                | grep -nE "$pattern" > /tmp/deident-hits.txt
              then
                status=0
              else
                status=$?
              fi
              # 0 = matched, 1 = no match, >=2 = grep itself failed. Treating a
              # failure as "clean" is how a gate silently stops gating, so stop.
              if [ "$status" -ge 2 ]; then
                echo "::error::grep failed (exit $status) on $file for pattern '$pattern' — gate cannot verify this diff"
                exit 1
              fi
              if [ "$status" -eq 0 ] && [ -s /tmp/deident-hits.txt ]; then
                echo "::error file=$file::employer-identifying pattern '$pattern' added"
                cat /tmp/deident-hits.txt
                violations=$((violations + $(wc -l < /tmp/deident-hits.txt)))
              fi
            done < /tmp/deident-text.txt
          done

          # Filename pass — a screenshot leaks more than prose, and its name is
          # the only part of a binary this gate can read.
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            base=$(basename "$file")
            if echo "$base" | grep -qE '(^|[^A-Za-z0-9])[Ll][Gg][Ee]([^A-Za-z0-9]|$)|[Ll][Gg]enie|포털'
            then
              echo "::error file=$file::employer-identifying filename"
              violations=$((violations + 1))
            else
              status=$?
              [ "$status" -ge 2 ] && { echo "::error::grep failed (exit $status) on filename $file"; exit 1; }
            fi
            case "$file" in
              web/public/screenshots/ep-*)
                echo "::error file=$file::internal-portal screenshot capture — these are not published"
                violations=$((violations + 1))
                ;;
            esac
          done < /tmp/deident-changed.txt

          if [ "$violations" -gt 0 ]; then
            echo ""
            echo "::error::deidentification-gate found $violations employer-identifying addition(s)."
            echo "This repository is public. Use the generic vocabulary instead:"
            echo "  employer / brand name        -> drop entirely, or 'the organization'"
            echo "  the internal portal product  -> '사내 포털 플러그인' / 'an internal portal plugin'"
            echo "  the internal search product  -> '사내 검색' / 'internal search'"
            echo "  internal hostnames           -> fixture domains (portal.example.com)"
            echo "  a specific plugin in prose   -> the generic noun '플러그인' / 'plugin'"
            exit 1
          fi

          echo "deidentification-gate: clean."
