name: Web CI

# CI for the monorepo landing site under web/ (Next.js static export → Cloudflare
# Pages). Runs only when web/ changes so it stays independent of the app CI.
# This workflow is a secret-free build gate for PRs and pushes. Deployment is
# owned by web-deploy.yml and its protected production environment.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: Build (static export)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install (retry on transient registry flakes)
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "::warning::bun install attempt $attempt failed; clearing cache + retrying"
            rm -rf ~/.bun/install/cache || true
            sleep 10
          done
          echo "::error::bun install failed after 3 attempts"; exit 1
      # `next build` runs type-checking + lint + the static export, so it is the
      # whole gate — a broken page, type error, or bad import fails here.
      - name: Build
        run: bun run build
      - name: Upload static export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-out
          path: web/out
          if-no-files-found: error
          retention-days: 3

  # The images and the manifest that declares them (`web/screenshot-provenance
  # .json`) both live under `web/`, so this workflow's path filter fires
  # whenever either changes. ci.yml reads the same manifest, but its
  # `pull_request` trigger is `branches: [main]` while this workflow filters on
  # paths only — so on a pull request targeting `dev` this job is the only
  # reading of that manifest, and on one targeting `main` it is the second.
  #
  # A separate job rather than the first step of `build`, and here that costs no
  # enforcement: `Build (static export)` is not a required status check on
  # `main`. Read the current list with
  #   gh api repos/lvis-project/lvis-app/branches/main/protection \
  #     --jq .required_status_checks.contexts
  # Moving the gate out of `build` therefore took no merge requirement with it.
  # ci.yml's copy stays inside `build-and-test` for the opposite reason, which
  # the comment beside it gives. Here the gate used to run before the install,
  # justified as fail-fast, and a stale manifest therefore skipped `next build`
  # entirely — no type check, no lint, no export, and a red check that meant
  # nothing had been built. Fail-fast on bookkeeping is exactly the argument
  # that produced the outage; a parallel job is fast without being in the way.
  #
  # It reads the provenance declarations, not the pixels — the limits are
  # spelled out in docs/development/screenshot-reshoot.md. `working-directory`
  # is set per step because this workflow defaults every `run` to `web/`.
  screenshot-provenance:
    name: Screenshot provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Screenshot provenance gate
        working-directory: .
        run: node scripts/check-screenshot-provenance-self-test.mjs && node scripts/check-screenshot-provenance.mjs
