name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    # All runs use ephemeral GitHub-hosted ARM64 runners. Ephemeral VMs
    # cannot persist state or exfiltrate secrets across runs, which closes
    # the "pwn-request" supply-chain RCE vector that made the prior
    # self-hosted Oracle runner risky for fork PRs (a fork controls
    # package.json + postinstall scripts, and `bun install` would execute
    # attacker code). ARM64 keeps native-module (better-sqlite3 etc.) parity
    # with the dev fleet. Core CI is deliberately secret-free and does not
    # clone private sibling repositories; cross-repository integration belongs
    # to trusted default-branch repository_dispatch workflows.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lvis-app
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-ci-bun-${{ hashFiles('lvis-app/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-
      # Cache the built node_modules (Electron dist + electron-rebuilt native
      # modules) keyed on os+arch+lockfile. On a hit, `bun install` restores the
      # ABI-correct binaries without re-downloading Electron or recompiling
      # better-sqlite3/node-pty. Exact-key only — a lockfile change (which pins
      # the Electron version) misses and rebuilds, so a stale ABI never leaks in.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lvis-app/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('lvis-app/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: lvis-app
      # uv is fetched to resources/ (outside node_modules) by the postinstall,
      # which bun skips when node_modules is already satisfied from cache. Ensure
      # it explicitly — fetch-uv is idempotent (no-op when already present).
      - name: Ensure uv toolchain
        working-directory: lvis-app
        run: node scripts/fetch-uv.mjs
      # The steps above are preconditions, not gates: without a checkout, an
      # install and the uv toolchain there is nothing to verify, so a red job
      # there genuinely means "could not verify". From here down the job
      # compiles, builds and tests the product — every step below is one of
      # those, except `Remove root-level Bun binary shims`, which prepares the
      # runner for the step after it — and the repository-hygiene gates run
      # after all of it, at the end of this job. The block above them says why
      # they are there and not above.
      - name: Typecheck
        working-directory: lvis-app
        run: bun run typecheck
      # `typecheck` covers production sources only — both tsconfigs exclude
      # `src/**/__tests__/**`, so before this step a test could reference an unimported
      # symbol and reach CI green. This is the ratchet for the rest: new test files are
      # fully checked, existing ones may only improve. The self-test runs beside it
      # because a ratchet that silently stops comparing reports green forever.
      - name: Typecheck tests (baseline ratchet)
        working-directory: lvis-app
        run: bun run check:typecheck-tests:self-test && bun run check:typecheck-tests
      # Postinstall leaves native modules on Electron's ABI. The shared Vitest
      # runner uses ELECTRON_RUN_AS_NODE, so tests and the desktop runtime consume
      # that same binary without an in-place Node-ABI rebuild.
      - run: bun run build
        working-directory: lvis-app
      - name: Remove root-level Bun binary shims before Vitest
        working-directory: lvis-app
        run: rm -f ajv pino
      - name: Run the suite and its coverage gate
        # The suite resolves entirely from lvis-app/src. Sibling slugs appear
        # only as fixtures or mocked installer inputs.
        #
        # `check:test-coverage`, not `check:test-quality`: that composite runs
        # `check:test-duplicates` first, so a duplicated test helper would end
        # this step before a single test executed — the same masking defect one
        # layer down, in an npm script instead of a workflow. This job calls the
        # composite's two halves separately, the duplicate scan last;
        # `check:test-quality` stays as the local one-shot README.md documents.
        run: bun run check:test-coverage
        working-directory: lvis-app
      # Test suites, not policy gates, which is why they sit with the
      # verification steps: alongside its source-only assertions over the
      # release-signing workflow the evidence suite exercises the
      # release-tooling libraries themselves — descriptor reading,
      # signed-manifest verification, packaged executable selection — and
      # `test:ci-tooling` covers the A2A wire harness and the marketplace-e2e
      # control script that the dispatch workflows execute. Failure means that
      # code is wrong. They run under `node --test` rather than vitest (whose
      # include is `*.test.{ts,tsx}`), so they need their own step; the
      # evidence suite was once invoked by nothing and sat red for twelve days
      # after a batch dependency merge moved a pin without moving its
      # assertion, and the two `test:ci-tooling` suites were never invoked at
      # all until this step named them.
      #
      # Last of the verification steps, so this narrow suite does not skip the
      # broad one. `packaging-discipline-source.test.ts` pins that position —
      # "keeps the release-tooling suite last among the verification steps"
      # fails if any later command in this job compiles, builds or tests. The
      # reverse ordering would only cost information: a red build-and-test says
      # the code failed either way.
      - name: Run release-tooling tests
        working-directory: lvis-app
        run: bun run test:ci-tooling && bun run test:a2a-p4-5:evidence
      # Repository hygiene: manifests, baseline ledgers, and the self-tests of
      # the gates that read them. Nothing below compiles or runs the product; a
      # failure here means a bookkeeping file is stale, not that the code is
      # broken.
      #
      # Two of the four used to run ahead of Typecheck; the duplicate scan ran
      # ahead of the suite from inside `check:test-quality`, and the sunset
      # ledger ahead of every compile from inside `bun run build`. Two changes
      # landed the same day — one declared every tracked image in a manifest,
      # the other deleted some of those images — and the merge left the
      # manifest stale. The gate failed, and because a job stops at its first
      # failed step, Typecheck, the test-typecheck ratchet, the build and the
      # entire suite were skipped. `main` carried a red check that meant
      # "nothing was verified", which is indistinguishable from "something was
      # verified and failed" and so is worse than having no gate at all.
      # Running these four after every verification step ends that for them.
      # It does not end it for the repository: the paragraph below names the
      # commands where the same shape survives, inside `bun run build`.
      #
      # Last *in this job* rather than in a job of their own, because the check
      # name `build-and-test` is one of the two required status checks on
      # `main`; the other is `naming-gate`. Read the current list with
      #   gh api repos/lvis-project/lvis-app/branches/main/protection \
      #     --jq .required_status_checks.contexts
      # A separate job reports under a separate check name, and a name branch
      # protection does not list cannot block a merge. That is measured, not
      # feared: an earlier revision of this change put these three in a
      # `repo-hygiene` job, and on a commit carrying a deliberately stale
      # manifest entry both required contexts reported success. Two checks did
      # go red on it — `Repository hygiene gates` here and `Screenshot
      # provenance` in web-ci.yml — and neither name is in the required list,
      # so neither stood between that manifest and a merge. Two jobs is the
      # better shape and stays available — but the required-contexts list has to
      # gain the new name in the same change, or the split trades a masking bug
      # for a silent hole.
      #
      # Within this trailing group the first failure still skips the rest: a red
      # Knip gate leaves the screenshot, duplicate and sunset scans reported as
      # skipped. That is accepted, not overlooked. Every verification step has
      # already run and reported its own result by then, and the failing step
      # names itself, so the red says one true thing — a ledger is stale, and
      # this is the first one. Reporting all four independently would need `if:
      # always()` on each, which also runs them after a genuine build failure
      # and chains bookkeeping noise onto a red that already has its answer, or
      # one runner per gate.
      #
      # What this ordering does NOT reach: `bun run build` above is one workflow
      # step and sixteen commands, and ten of those assert rather than compile.
      # Four of the ten — `check:import-cycles`, `check-generated-assets`,
      # `check:i18n-catalog`, `check:i18n-barrels` — sit ahead of a later
      # compile command inside the composite, and all ten sit ahead of the
      # suite in this job, so any of them can fail the build step and skip the
      # steps after it. That residual is deliberate and bounded: each reads
      # either the sources being compiled or the bytes the build itself just
      # wrote, and a local `bun run build` is where their drift has to surface.
      # `check:sunset-inventory` was the one that did not fit that description —
      # it reads a hand-written ledger naming source paths that any unrelated
      # change can delete, the same shape as the manifest incident above — so it
      # left the composite and runs here instead. Measured on this tree before
      # the move: one nonexistent path added to the inventory made `bun run
      # build` exit 1 at `[sunset-inventory]`, with clean-dist, build:icons,
      # build:main and build:webpack never reached.
      #
      # `src/__tests__/packaging-discipline-source.test.ts` fails if any job in
      # .github/workflows/ puts one of these gates ahead of a compile or test
      # step, if these gates leave `build-and-test`, if one of them re-enters
      # the `build` composite, and if the set of asserting commands inside that
      # composite changes without the list above changing with it.
      # `check:gate-core` is the one inventory of the gates both CI and the
      # pre-push hook (scripts/hooks/run-local-checks.mjs) run: the Knip
      # baseline, the duplicate-helper scan, the sunset ledger, the
      # single-source shape ledger. The two callers
      # used to list them separately and had drifted. The gates below it are
      # CI-only on purpose — the Knip self-test, the screenshot-provenance
      # gate and its self-test cost more than a pre-push budget allows — and
      # `check:test-coverage` above is CI-only for the same reason.
      - name: Core hygiene gates
        working-directory: lvis-app
        run: bun run check:gate-core && bun run test:knip-gate
      # The docs-site images are published publicly, and the batch that is there
      # now was captured by hand from a live session — see
      # docs/development/screenshot-reshoot.md. This gate cannot read pixels; it
      # refuses an image that arrives without a written provenance claim, and
      # ratchets the backlog of images still awaiting replacement. The self-test
      # runs beside it because a gate nothing exercises reports green after it
      # has stopped comparing.
      - name: Screenshot provenance gate
        working-directory: lvis-app
        run: bun run check:screenshot-provenance:self-test && bun run check:screenshot-provenance

  windows-permission-tests:
    name: Windows permission path tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lvis-app
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-ci-bun-${{ hashFiles('lvis-app/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lvis-app/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('lvis-app/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: lvis-app
      - name: Run Windows permission regressions
        working-directory: lvis-app
        run: >
          bun run test --
          src/permissions/__tests__/allowed-directories.test.ts
          src/permissions/__tests__/sensitive-paths-canonicalize.test.ts
          src/permissions/__tests__/permission-manager-meta-override.test.ts
          src/tools/__tests__/executor.test.ts
          src/tools/__tests__/registry-meta-governance.test.ts
          src/tools/__tests__/executor-rationale-batch.test.ts
          src/tools/pipeline/__tests__/rationale-host-coordinator.test.ts
          src/tools/pipeline/__tests__/rationale-host-service.test.ts
          src/tools/pipeline/__tests__/rationale-invocation-journal.test.ts
          src/tools/pipeline/__tests__/rationale-ticket-store.test.ts
          src/engine/turn/__tests__/rationale-real-stack.integration.test.ts
          src/audit/__tests__/hmac-chain.test.ts
          src/audit/__tests__/rationale-audit-adapter.test.ts
          src/boot/__tests__/plugin-surface-permissions.test.ts
          src/permissions/__tests__/windows-sandbox-logic.test.ts
          src/permissions/__tests__/asrt-windows-support.test.ts
          src/tools/__tests__/shell-windows-partial-plan-b.test.ts
          src/lib/__tests__/atomic-file.test.ts
          src/shared/__tests__/lvis-home.test.ts
          src/lib/__tests__/with-file-lock.test.ts
          src/data/__tests__/secret-document-store.test.ts
          src/plugins/__tests__/registry-atomicity.test.ts
          src/plugins/__tests__/registry-migration.test.ts
          src/plugins/__tests__/installed-entry-fs.test.ts
          src/plugins/__tests__/plugin-artifact-store-windows-lock.test.ts
          src/plugins/__tests__/marketplace-managed-bootstrap.test.ts
          src/plugins/__tests__/marketplace-update-recovery.test.ts
          src/plugins/__tests__/marketplace-dispatcher.test.ts
          src/plugins/__tests__/install-local.test.ts
          src/plugins/__tests__/trust-boundary.test.ts

  macos-permission-tests:
    name: macOS permission path tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lvis-app
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-ci-bun-${{ hashFiles('lvis-app/bun.lock') }}
          restore-keys: ${{ runner.os }}-ci-bun-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lvis-app/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-nm-${{ hashFiles('lvis-app/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: lvis-app
      # The plugin-confinement cases need a LIVE sandbox, and the Linux job that
      # runs the whole suite has no bubblewrap — so there they return early and
      # pass without measuring anything. macOS needs no backend install, which
      # makes this the one job in CI that can actually execute them.
      # `LVIS_REQUIRE_SANDBOX_CASES=1` is what stops that from being a silent
      # arrangement: if the sandbox cannot initialize here, the cases FAIL
      # instead of reporting a measurement they never took.
      - name: Run macOS permission regressions
        working-directory: lvis-app
        env:
          LVIS_REQUIRE_SANDBOX_CASES: "1"
        run: >
          bun run test --
          src/plugins/isolation/__tests__/confined-plugin-child.test.ts
          src/permissions/__tests__/allowed-directories.test.ts
          src/permissions/__tests__/permission-manager-meta-override.test.ts
          src/tools/__tests__/registry-meta-governance.test.ts
          src/tools/__tests__/executor-rationale-batch.test.ts
          src/tools/pipeline/__tests__/rationale-host-coordinator.test.ts
          src/tools/pipeline/__tests__/rationale-host-service.test.ts
          src/tools/pipeline/__tests__/rationale-invocation-journal.test.ts
          src/tools/pipeline/__tests__/rationale-ticket-store.test.ts
          src/engine/turn/__tests__/rationale-real-stack.integration.test.ts
          src/audit/__tests__/hmac-chain.test.ts
          src/audit/__tests__/rationale-audit-adapter.test.ts
          src/data/__tests__/secret-document-store.test.ts
