name: Marketplace E2E (publish ↔ install)

# Cross-repository credentials exist only in stage-inputs. That job resolves
# immutable same-repository PR heads or verifies exact main-ancestor raw SHAs
# without submodules, and runs only the trusted control program from
# github.workflow_sha. Candidate code executes later on fresh, secret-free
# runners and only inside containers.
on:
  repository_dispatch:
    types: [marketplace-e2e]
  schedule:
    - cron: "30 17 * * *"

permissions:
  contents: read
  pull-requests: read

env:
  PUBLISHER_KEY: lvismkt_e2epub_${{ github.run_id }}_${{ github.run_attempt }}
  REVIEWER_KEY: lvismkt_e2erev_${{ github.run_id }}_${{ github.run_attempt }}
  ADMIN_KEY: lvismkt_e2eadm_${{ github.run_id }}_${{ github.run_attempt }}

jobs:
  stage-inputs:
    name: Stage exact candidate inputs (credentialed, no execution)
    if: github.repository == 'lvis-project/lvis-app'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      nonce: ${{ steps.bind.outputs.nonce }}
      manifest-sha256: ${{ steps.bind.outputs.manifest_sha256 }}
      host_sha: ${{ steps.resolve-candidate-refs.outputs.host_sha }}
      marketplace_sha: ${{ steps.resolve-candidate-refs.outputs.marketplace_sha }}
      sdk_sha: ${{ steps.resolve-candidate-refs.outputs.sdk_sha }}
      ep_api_sha: ${{ steps.resolve-candidate-refs.outputs.ep_api_sha }}
    steps:
      - name: Checkout trusted workflow control
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: control
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Resolve same-repository open PR heads
        id: resolve-candidate-refs
        shell: bash
        env:
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          HOST_DEFAULT_REF: ${{ github.sha }}
          MARKETPLACE_DEFAULT_REF: ${{ vars.M4_MARKETPLACE_SHA }}
          SDK_DEFAULT_REF: ${{ vars.M4_SDK_SHA }}
          EP_API_DEFAULT_REF: ${{ vars.M4_EP_API_SHA }}
          HOST_API_TOKEN: ${{ github.token }}
          MARKETPLACE_API_TOKEN: ${{ secrets.M4_MARKETPLACE_CHECKOUT_TOKEN }}
          SDK_API_TOKEN: ${{ github.token }}
          EP_API_TOKEN: ${{ secrets.M4_MARKETPLACE_CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          set +x

          fail() {
            echo "::error::$*" >&2
            exit 1
          }

          payload_input="${DISPATCH_PAYLOAD:-null}"
          payload="$(jq -ce '
            if . == null then {} elif type == "object" then .
            else error("client payload must be an object") end
          ' <<<"$payload_input")" \
            || fail "repository_dispatch client payload must be an object"

          payload_has() {
            jq -e --arg key "$1" 'has($key)' <<<"$payload" >/dev/null
          }

          payload_value() {
            jq -er --arg key "$1" '
              .[$key]
              | if type == "number" or type == "string"
                then tostring
                else error("selector must be a number or string")
                end
            ' <<<"$payload"
          }

          api_get_pull() {
            local token="$1"
            local repo="$2"
            local pr_number="$3"

            [[ -n "$token" ]] || fail "$repo PR selector requires a GitHub API token"
            GH_TOKEN="$token" gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$repo/pulls/$pr_number"
          }

          resolve_open_same_repository_pr() {
            local repo="$1"
            local pr_number="$2"
            local token="$3"
            local response

            [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] \
              || fail "$repo PR selector must be a positive integer"
            response="$(api_get_pull "$token" "$repo" "$pr_number")" \
              || return 1
            jq -er --arg repo "$repo" '
              if .state != "open" then
                error("candidate PR is not open")
              elif .base.repo.full_name != $repo or .base.ref != "main" then
                error("candidate PR does not target this repository main branch")
              elif .head.repo.full_name != $repo then
                error("candidate PR head is not from the same repository")
              elif (.head.sha | type) != "string"
                or (.head.sha | test("^[0-9a-f]{40}$") | not)
              then
                error("candidate PR head is not an exact lowercase commit SHA")
              else
                .head.sha
              end
            ' <<<"$response"
          }

          resolve_candidate() {
            local repo="$1"
            local pr_field="$2"
            local ref_field="$3"
            local default_ref="$4"
            local token="$5"
            local has_pr=false
            local has_ref=false
            local selector
            local resolved_sha

            if payload_has "$pr_field"; then has_pr=true; fi
            if payload_has "$ref_field"; then has_ref=true; fi
            if [[ "$has_pr" == true && "$has_ref" == true ]]; then
              fail "$repo dispatch must provide only one of $pr_field or $ref_field"
            fi
            if [[ "$has_pr" == true ]]; then
              selector="$(payload_value "$pr_field")" || return 1
              resolved_sha="$(resolve_open_same_repository_pr \
                "$repo" "$selector" "$token")" || return 1
              printf '%s\tsame-repo-pr\n' "$resolved_sha"
              return
            fi

            if [[ "$has_ref" == true ]]; then
              selector="$(payload_value "$ref_field")" || return 1
            else
              selector="$default_ref"
            fi
            [[ "$selector" =~ ^[0-9a-f]{40}$ ]] \
              || fail "$repo raw SHA selector must be an exact lowercase 40-character SHA"
            printf '%s\traw-sha\n' "$selector"
          }

          validate_resolution() {
            local repo="$1"
            local sha="$2"
            local selector_kind="$3"

            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] \
              || fail "$repo resolver did not return an exact lowercase commit SHA"
            if [[ "$selector_kind" != "raw-sha" && "$selector_kind" != "same-repo-pr" ]]; then
              fail "$repo resolver returned an unsupported selector kind"
            fi
          }

          result="$(resolve_candidate \
            "lvis-project/lvis-app" "host_pr" "host_ref" "$HOST_DEFAULT_REF" "$HOST_API_TOKEN")" \
            || fail "Unable to resolve lvis-project/lvis-app candidate"
          IFS=$'\t' read -r host_sha host_selector_kind <<<"$result" \
            || fail "lvis-project/lvis-app resolver returned no candidate"
          validate_resolution "lvis-project/lvis-app" "$host_sha" "$host_selector_kind"
          result="$(resolve_candidate \
            "lvis-project/lvis-marketplace" "marketplace_pr" "marketplace_ref" \
            "$MARKETPLACE_DEFAULT_REF" "$MARKETPLACE_API_TOKEN")" \
            || fail "Unable to resolve lvis-project/lvis-marketplace candidate"
          IFS=$'\t' read -r marketplace_sha marketplace_selector_kind <<<"$result" \
            || fail "lvis-project/lvis-marketplace resolver returned no candidate"
          validate_resolution "lvis-project/lvis-marketplace" "$marketplace_sha" "$marketplace_selector_kind"
          result="$(resolve_candidate \
            "lvis-project/lvis-plugin-sdk" "sdk_pr" "sdk_ref" "$SDK_DEFAULT_REF" "$SDK_API_TOKEN")" \
            || fail "Unable to resolve lvis-project/lvis-plugin-sdk candidate"
          IFS=$'\t' read -r sdk_sha sdk_selector_kind <<<"$result" \
            || fail "lvis-project/lvis-plugin-sdk resolver returned no candidate"
          validate_resolution "lvis-project/lvis-plugin-sdk" "$sdk_sha" "$sdk_selector_kind"
          result="$(resolve_candidate \
            "lvis-project/lvis-plugin-ep" "ep_pr" "ep_api_ref" \
            "$EP_API_DEFAULT_REF" "$EP_API_TOKEN")" \
            || fail "Unable to resolve lvis-project/lvis-plugin-ep candidate"
          IFS=$'\t' read -r ep_api_sha ep_api_selector_kind <<<"$result" \
            || fail "lvis-project/lvis-plugin-ep resolver returned no candidate"
          validate_resolution "lvis-project/lvis-plugin-ep" "$ep_api_sha" "$ep_api_selector_kind"

          {
            echo "host_sha=$host_sha"
            echo "marketplace_sha=$marketplace_sha"
            echo "sdk_sha=$sdk_sha"
            echo "ep_api_sha=$ep_api_sha"
            echo "host_selector_kind=$host_selector_kind"
            echo "marketplace_selector_kind=$marketplace_selector_kind"
            echo "sdk_selector_kind=$sdk_selector_kind"
            echo "ep_api_selector_kind=$ep_api_selector_kind"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout lvis-app
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: candidates/lvis-app
          ref: ${{ steps.resolve-candidate-refs.outputs.host_sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Checkout lvis-marketplace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: lvis-project/lvis-marketplace
          path: candidates/lvis-marketplace
          ref: ${{ steps.resolve-candidate-refs.outputs.marketplace_sha }}
          token: ${{ secrets.M4_MARKETPLACE_CHECKOUT_TOKEN }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Checkout lvis-plugin-sdk
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: lvis-project/lvis-plugin-sdk
          path: candidates/lvis-plugin-sdk
          ref: ${{ steps.resolve-candidate-refs.outputs.sdk_sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Checkout lvis-plugin-lge-api
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: lvis-project/lvis-plugin-ep
          path: candidates/lvis-plugin-lge-api
          ref: ${{ steps.resolve-candidate-refs.outputs.ep_api_sha }}
          token: ${{ secrets.M4_MARKETPLACE_CHECKOUT_TOKEN }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Prove exact immutable candidate refs
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          HOST_SHA: ${{ steps.resolve-candidate-refs.outputs.host_sha }}
          MARKETPLACE_SHA: ${{ steps.resolve-candidate-refs.outputs.marketplace_sha }}
          SDK_SHA: ${{ steps.resolve-candidate-refs.outputs.sdk_sha }}
          EP_API_SHA: ${{ steps.resolve-candidate-refs.outputs.ep_api_sha }}
          HOST_SELECTOR_KIND: ${{ steps.resolve-candidate-refs.outputs.host_selector_kind }}
          MARKETPLACE_SELECTOR_KIND: ${{ steps.resolve-candidate-refs.outputs.marketplace_selector_kind }}
          SDK_SELECTOR_KIND: ${{ steps.resolve-candidate-refs.outputs.sdk_selector_kind }}
          EP_API_SELECTOR_KIND: ${{ steps.resolve-candidate-refs.outputs.ep_api_selector_kind }}
        run: |
          set -euo pipefail
          for value in "$WORKFLOW_SHA" "$HOST_SHA" "$MARKETPLACE_SHA" "$SDK_SHA" "$EP_API_SHA"; do
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Every workflow and candidate ref must be an exact lowercase SHA"
              exit 1
            fi
          done
          test "$(git -C control rev-parse HEAD)" = "$WORKFLOW_SHA"
          for spec in \
            "candidates/lvis-app:$HOST_SHA:$HOST_SELECTOR_KIND" \
            "candidates/lvis-marketplace:$MARKETPLACE_SHA:$MARKETPLACE_SELECTOR_KIND" \
            "candidates/lvis-plugin-sdk:$SDK_SHA:$SDK_SELECTOR_KIND" \
            "candidates/lvis-plugin-lge-api:$EP_API_SHA:$EP_API_SELECTOR_KIND"; do
            repo="${spec%%:*}"
            remainder="${spec#*:}"
            expected="${remainder%%:*}"
            selector_kind="${remainder#*:}"
            test "$(git -C "$repo" rev-parse HEAD)" = "$expected"
            if [[ "$selector_kind" == "raw-sha" ]]; then
              git -C "$repo" merge-base --is-ancestor "$expected" origin/main
            elif [[ "$selector_kind" != "same-repo-pr" ]]; then
              echo "::error::Unsupported candidate selector kind: $selector_kind"
              exit 1
            fi
            test -z "$(git -C "$repo" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          done

      - name: Validate contracts and create safe source archives
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          HOST_SHA: ${{ steps.resolve-candidate-refs.outputs.host_sha }}
          MARKETPLACE_SHA: ${{ steps.resolve-candidate-refs.outputs.marketplace_sha }}
          SDK_SHA: ${{ steps.resolve-candidate-refs.outputs.sdk_sha }}
          EP_API_SHA: ${{ steps.resolve-candidate-refs.outputs.ep_api_sha }}
        run: |
          set -euo pipefail
          mkdir -p staged
          node control/scripts/marketplace-e2e-control.mjs stage \
            --workflow-sha "$WORKFLOW_SHA" \
            --host-sha "$HOST_SHA" \
            --marketplace-sha "$MARKETPLACE_SHA" \
            --sdk-sha "$SDK_SHA" \
            --ep-api-sha "$EP_API_SHA" \
            --host-root candidates/lvis-app \
            --marketplace-root candidates/lvis-marketplace \
            --sdk-root candidates/lvis-plugin-sdk \
            --ep-root candidates/lvis-plugin-lge-api \
            --output-dir staged

      - name: Bind downstream jobs to nonce and manifest digest
        id: bind
        run: |
          set -euo pipefail
          nonce="$(node -p 'JSON.parse(require("fs").readFileSync("staged/input-manifest.json")).nonce')"
          manifest_sha256="$(sha256sum staged/input-manifest.json | cut -d ' ' -f 1)"
          echo "nonce=$nonce" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload trusted input manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-input-manifest
          path: staged/input-manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact Host source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-host-source
          path: staged/host-source.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact Marketplace source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-marketplace-source
          path: staged/marketplace-source.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact SDK source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-sdk-source
          path: staged/sdk-source.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact EP source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-ep-source
          path: staged/ep-source.tar
          if-no-files-found: error
          retention-days: 1

  build-marketplace:
    name: Build Marketplace image (secret-free candidate runner)
    needs: stage-inputs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      HOST_SHA: ${{ needs.stage-inputs.outputs.host_sha }}
      MARKETPLACE_SHA: ${{ needs.stage-inputs.outputs.marketplace_sha }}
      SDK_SHA: ${{ needs.stage-inputs.outputs.sdk_sha }}
      EP_API_SHA: ${{ needs.stage-inputs.outputs.ep_api_sha }}
    steps:
      - name: Checkout trusted workflow control
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: control
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Download trusted input manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: m4-input-manifest
          path: inputs

      - name: Download exact Marketplace source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: m4-marketplace-source
          path: inputs

      - name: Verify and extract Marketplace source
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_MANIFEST_SHA: ${{ needs.stage-inputs.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum inputs/input-manifest.json | cut -d ' ' -f 1)" = "$EXPECTED_MANIFEST_SHA"
          mkdir -p candidate
          node control/scripts/marketplace-e2e-control.mjs extract-source \
            --workflow-sha "$WORKFLOW_SHA" \
            --host-sha "$HOST_SHA" \
            --marketplace-sha "$MARKETPLACE_SHA" \
            --sdk-sha "$SDK_SHA" \
            --ep-api-sha "$EP_API_SHA" \
            --manifest inputs/input-manifest.json \
            --source marketplace \
            --archive inputs/marketplace-source.tar \
            --destination candidate/lvis-marketplace

      - name: Build candidate and trusted runtime wrapper
        env:
          NONCE: ${{ needs.stage-inputs.outputs.nonce }}
        run: |
          set -euo pipefail
          base_image="m4-marketplace-base:$NONCE"
          final_image="m4-marketplace:$NONCE"
          docker build \
            --file candidate/lvis-marketplace/server/Dockerfile \
            --tag "$base_image" \
            candidate/lvis-marketplace
          docker build \
            --build-arg "CANDIDATE_IMAGE=$base_image" \
            --build-arg "E2E_NONCE=$NONCE" \
            --build-arg "HOST_SHA=$HOST_SHA" \
            --build-arg "MARKETPLACE_SHA=$MARKETPLACE_SHA" \
            --build-arg "SDK_SHA=$SDK_SHA" \
            --build-arg "EP_API_SHA=$EP_API_SHA" \
            --file control/.github/marketplace-e2e/marketplace.Dockerfile \
            --tag "$final_image" \
            candidate/lvis-marketplace
          mkdir -p outputs
          docker save --output outputs/marketplace-image.tar "$final_image"

      - name: Bind Marketplace image to exact inputs
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          node control/scripts/marketplace-e2e-control.mjs bind-output \
            --workflow-sha "$WORKFLOW_SHA" \
            --host-sha "$HOST_SHA" \
            --marketplace-sha "$MARKETPLACE_SHA" \
            --sdk-sha "$SDK_SHA" \
            --ep-api-sha "$EP_API_SHA" \
            --manifest inputs/input-manifest.json \
            --kind marketplace-image \
            --artifact outputs/marketplace-image.tar \
            --output outputs/marketplace-image-manifest.json

      - name: Upload verified Marketplace image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-marketplace-image
          path: outputs/
          if-no-files-found: error
          retention-days: 1

  build-ep:
    name: Build EP bundle (secret-free candidate runner)
    needs: stage-inputs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      HOST_SHA: ${{ needs.stage-inputs.outputs.host_sha }}
      MARKETPLACE_SHA: ${{ needs.stage-inputs.outputs.marketplace_sha }}
      SDK_SHA: ${{ needs.stage-inputs.outputs.sdk_sha }}
      EP_API_SHA: ${{ needs.stage-inputs.outputs.ep_api_sha }}
    steps:
      - name: Checkout trusted workflow control
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: control
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Download trusted input manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: m4-input-manifest
          path: inputs

      - name: Download exact EP source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: m4-ep-source
          path: inputs

      - name: Verify and extract EP source
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_MANIFEST_SHA: ${{ needs.stage-inputs.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum inputs/input-manifest.json | cut -d ' ' -f 1)" = "$EXPECTED_MANIFEST_SHA"
          mkdir -p candidate
          node control/scripts/marketplace-e2e-control.mjs extract-source \
            --workflow-sha "$WORKFLOW_SHA" \
            --host-sha "$HOST_SHA" \
            --marketplace-sha "$MARKETPLACE_SHA" \
            --sdk-sha "$SDK_SHA" \
            --ep-api-sha "$EP_API_SHA" \
            --manifest inputs/input-manifest.json \
            --source ep \
            --archive inputs/ep-source.tar \
            --destination candidate/lvis-plugin-lge-api

      - name: Build EP inside an unmounted container image
        env:
          NONCE: ${{ needs.stage-inputs.outputs.nonce }}
        run: |
          set -euo pipefail
          image="m4-ep-builder:$NONCE"
          container="m4-ep-output-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build \
            --build-arg "E2E_NONCE=$NONCE" \
            --build-arg "HOST_SHA=$HOST_SHA" \
            --build-arg "MARKETPLACE_SHA=$MARKETPLACE_SHA" \
            --build-arg "SDK_SHA=$SDK_SHA" \
            --build-arg "EP_API_SHA=$EP_API_SHA" \
            --file control/.github/marketplace-e2e/ep.Dockerfile \
            --tag "$image" \
            candidate
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker create --name "$container" "$image"
          mkdir -p outputs
          docker cp "$container:/out/lvis-plugin-ep-$EP_API_SHA.zip" \
            "outputs/lvis-plugin-ep-$EP_API_SHA.zip"
          docker rm "$container"
          trap - EXIT

      - name: Bind EP bundle to exact inputs
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          node control/scripts/marketplace-e2e-control.mjs bind-output \
            --workflow-sha "$WORKFLOW_SHA" \
            --host-sha "$HOST_SHA" \
            --marketplace-sha "$MARKETPLACE_SHA" \
            --sdk-sha "$SDK_SHA" \
            --ep-api-sha "$EP_API_SHA" \
            --manifest inputs/input-manifest.json \
            --kind ep-bundle \
            --artifact "outputs/lvis-plugin-ep-$EP_API_SHA.zip" \
            --output outputs/ep-bundle-manifest.json

      - name: Upload verified EP bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-ep-bundle
          path: outputs/
          if-no-files-found: error
          retention-days: 1

  marketplace-e2e:
    name: Marketplace E2E (isolated live lifecycle + containment)
    needs: [stage-inputs, build-marketplace, build-ep]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      HOST_SHA: ${{ needs.stage-inputs.outputs.host_sha }}
      MARKETPLACE_SHA: ${{ needs.stage-inputs.outputs.marketplace_sha }}
      SDK_SHA: ${{ needs.stage-inputs.outputs.sdk_sha }}
      EP_API_SHA: ${{ needs.stage-inputs.outputs.ep_api_sha }}
      NONCE: ${{ needs.stage-inputs.outputs.nonce }}
      EXPECTED_MANIFEST_SHA: ${{ needs.stage-inputs.outputs.manifest-sha256 }}
      NETWORK_NAME: m4-internal-${{ github.run_id }}-${{ github.run_attempt }}
      MARKETPLACE_CONTAINER: m4-marketplace-${{ github.run_id }}-${{ github.run_attempt }}
      HOST_CONTAINER: m4-host-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout trusted workflow control
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: control
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Download trusted input manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: m4-input-manifest
          path: inputs

      - name: Download exact Host source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: m4-host-source
          path: inputs

      - name: Download exact SDK source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: m4-sdk-source
          path: inputs

      - name: Download verified Marketplace image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: m4-marketplace-image
          path: outputs/marketplace

      - name: Download verified EP bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: m4-ep-bundle
          path: outputs/ep

      - name: Verify every transferred digest before use
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(sha256sum inputs/input-manifest.json | cut -d ' ' -f 1)" = "$EXPECTED_MANIFEST_SHA"
          node control/scripts/marketplace-e2e-control.mjs verify-output \
            --workflow-sha "$WORKFLOW_SHA" \
            --host-sha "$HOST_SHA" \
            --marketplace-sha "$MARKETPLACE_SHA" \
            --sdk-sha "$SDK_SHA" \
            --ep-api-sha "$EP_API_SHA" \
            --manifest inputs/input-manifest.json \
            --kind marketplace-image \
            --output-manifest outputs/marketplace/marketplace-image-manifest.json \
            --artifact outputs/marketplace/marketplace-image.tar
          node control/scripts/marketplace-e2e-control.mjs verify-output \
            --workflow-sha "$WORKFLOW_SHA" \
            --host-sha "$HOST_SHA" \
            --marketplace-sha "$MARKETPLACE_SHA" \
            --sdk-sha "$SDK_SHA" \
            --ep-api-sha "$EP_API_SHA" \
            --manifest inputs/input-manifest.json \
            --kind ep-bundle \
            --output-manifest outputs/ep/ep-bundle-manifest.json \
            --artifact "outputs/ep/lvis-plugin-ep-$EP_API_SHA.zip"

      - name: Extract exact Host and SDK with trusted control
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          node control/scripts/marketplace-e2e-control.mjs extract-source \
            --workflow-sha "$WORKFLOW_SHA" \
            --host-sha "$HOST_SHA" \
            --marketplace-sha "$MARKETPLACE_SHA" \
            --sdk-sha "$SDK_SHA" \
            --ep-api-sha "$EP_API_SHA" \
            --manifest inputs/input-manifest.json \
            --source host \
            --archive inputs/host-source.tar \
            --destination candidate/lvis-app
          node control/scripts/marketplace-e2e-control.mjs extract-source \
            --workflow-sha "$WORKFLOW_SHA" \
            --host-sha "$HOST_SHA" \
            --marketplace-sha "$MARKETPLACE_SHA" \
            --sdk-sha "$SDK_SHA" \
            --ep-api-sha "$EP_API_SHA" \
            --manifest inputs/input-manifest.json \
            --source sdk \
            --archive inputs/sdk-source.tar \
            --destination candidate/lvis-plugin-sdk

      - name: Build Host-under-test in an unmounted non-root image
        run: |
          set -euo pipefail
          docker build \
            --build-arg "E2E_NONCE=$NONCE" \
            --build-arg "HOST_SHA=$HOST_SHA" \
            --build-arg "MARKETPLACE_SHA=$MARKETPLACE_SHA" \
            --build-arg "SDK_SHA=$SDK_SHA" \
            --build-arg "EP_API_SHA=$EP_API_SHA" \
            --file control/.github/marketplace-e2e/host.Dockerfile \
            --tag "m4-host:$NONCE" \
            candidate

      - name: Label-check Host image
        run: |
          set -euo pipefail
          labels="$(docker image inspect --format '{{json .Config.Labels}}' "m4-host:$NONCE")"
          node -e '
            const labels = JSON.parse(process.argv[1]);
            const expected = JSON.parse(process.argv[2]);
            for (const [key, value] of Object.entries(expected)) {
              if (labels[key] !== value) throw new Error("image label " + key + " mismatch");
            }
          ' "$labels" "$(node -e '
            console.log(JSON.stringify({
              "org.lvis.marketplace-e2e.nonce": process.env.NONCE,
              "org.lvis.marketplace-e2e.host-sha": process.env.HOST_SHA,
              "org.lvis.marketplace-e2e.marketplace-sha": process.env.MARKETPLACE_SHA,
              "org.lvis.marketplace-e2e.sdk-sha": process.env.SDK_SHA,
              "org.lvis.marketplace-e2e.ep-api-sha": process.env.EP_API_SHA,
            }))
          ')"

      - name: Load and label-check Marketplace image
        run: |
          set -euo pipefail
          docker load --input outputs/marketplace/marketplace-image.tar
          image="m4-marketplace:$NONCE"
          labels="$(docker image inspect --format '{{json .Config.Labels}}' "$image")"
          node -e '
            const labels = JSON.parse(process.argv[1]);
            const expected = JSON.parse(process.argv[2]);
            for (const [key, value] of Object.entries(expected)) {
              if (labels[key] !== value) throw new Error("image label " + key + " mismatch");
            }
          ' "$labels" "$(node -e '
            console.log(JSON.stringify({
              "org.lvis.marketplace-e2e.nonce": process.env.NONCE,
              "org.lvis.marketplace-e2e.host-sha": process.env.HOST_SHA,
              "org.lvis.marketplace-e2e.marketplace-sha": process.env.MARKETPLACE_SHA,
              "org.lvis.marketplace-e2e.sdk-sha": process.env.SDK_SHA,
              "org.lvis.marketplace-e2e.ep-api-sha": process.env.EP_API_SHA,
            }))
          ')"

      - name: Start isolated no-egress Marketplace
        run: |
          set -euo pipefail
          docker network create --internal --driver bridge "$NETWORK_NAME"
          docker create \
            --name "$MARKETPLACE_CONTAINER" \
            --network "$NETWORK_NAME" \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m \
            --env "PUBLISHER_KEY=$PUBLISHER_KEY" \
            --env "REVIEWER_KEY=$REVIEWER_KEY" \
            --env "ADMIN_KEY=$ADMIN_KEY" \
            --env "MARKETPLACE_DB_URL=sqlite+aiosqlite:////tmp/m4-marketplace.db" \
            --env "LVIS_MARKETPLACE_STORAGE_DIR=/tmp/m4-marketplace-storage" \
            --env "LVIS_MARKETPLACE_RATE_LIMIT_DISABLED=1" \
            --env "LVIS_MARKETPLACE_SKIP_BOOTSTRAP=1" \
            --env "LVIS_MARKETPLACE_PLUGIN_SCHEMA_REMOTE_ENABLED=false" \
            --env "PYTHONDONTWRITEBYTECODE=1" \
            --env "PYTHONPATH=/app/e2e:/app/src" \
            --entrypoint /bin/sh \
            "m4-marketplace:$NONCE" \
            -c '
              set -eu
              signer_json="$(python /app/e2e/scripts/print_test_poc_signer_env.py --format json)"
              signer="$(printf "%s" "$signer_json" | python -c "import json,sys; print(json.load(sys.stdin)[\"MARKETPLACE_SIGNING_PRIVATE_KEY_POC_V1\"])")"
              export MARKETPLACE_SIGNING_PRIVATE_KEY_POC_V1="$signer"
              python /app/e2e/scripts/seed_e2e_keys.py \
                --publisher-key "$PUBLISHER_KEY" \
                --admin-key "$ADMIN_KEY"
              # Marketplace rejects self-approval, so seed a distinct reviewer
              # principal for managed-plugin promotion.
              python /app/e2e/scripts/seed_e2e_keys.py \
                --publisher-key "$PUBLISHER_KEY" \
                --admin-key "$REVIEWER_KEY"
              # The E2E seed builds the current schema with SQLAlchemy metadata.
              # Historical Marketplace migrations are PostgreSQL-specific, so do
              # not replay them against this disposable SQLite database.
              alembic stamp head
              exec uvicorn lvis_marketplace.main:create_app \
                --factory --host 127.0.0.1 --port 8765
            '
          docker start "$MARKETPLACE_CONTAINER"
          for _ in $(seq 1 45); do
            if docker exec "$MARKETPLACE_CONTAINER" python -c \
              'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8765/api/v1/health", timeout=2).read()'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$MARKETPLACE_CONTAINER"
          exit 1

      - name: Create isolated Host candidate with verified EP bundle
        run: |
          set -euo pipefail
          chmod 0644 "outputs/ep/lvis-plugin-ep-$EP_API_SHA.zip"
          docker create \
            --name "$HOST_CONTAINER" \
            --network "container:$MARKETPLACE_CONTAINER" \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env "M4_E2E=1" \
            --env "HOST_SHA=$HOST_SHA" \
            --env "MARKETPLACE_SHA=$MARKETPLACE_SHA" \
            --env "SDK_SHA=$SDK_SHA" \
            --env "EP_API_SHA=$EP_API_SHA" \
            --env "MARKETPLACE_URL=http://127.0.0.1:8765" \
            --env "MARKETPLACE_PUBLISHER_KEY=$PUBLISHER_KEY" \
            --env "MARKETPLACE_REVIEWER_KEY=$REVIEWER_KEY" \
            --env "MARKETPLACE_ADMIN_KEY=$ADMIN_KEY" \
            --env "EP_API_BUNDLE_PATH=/tmp/lvis-plugin-ep-$EP_API_SHA.zip" \
            --env "SDK_ROOT=/workspace/lvis-plugin-sdk" \
            --env "BUNDLE_E2E_EVIDENCE_PATH=/evidence/marketplace-live-lifecycle-evidence.json" \
            --entrypoint /bin/bash \
            "m4-host:$NONCE" \
            -lc '
              set -euo pipefail
              cd /workspace/lvis-app
              bun run test:vitest -- run test/e2e/evidence-file.test.ts
              bun run test:vitest -- run --reporter=verbose \
                test/e2e/marketplace-e2e-fixture.test.ts \
                test/e2e/marketplace-e2e.test.ts
              xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
                bunx playwright test test/e2e/ui/marketplace-live-lifecycle.spec.ts --workers=1
              xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
                bunx playwright test test/e2e/ui/ep-attendance-live.spec.ts --workers=1
              bun run test:vitest -- run --reporter=verbose \
                test/e2e/marketplace-containment-rehearsal.test.ts
            '
          docker cp "outputs/ep/lvis-plugin-ep-$EP_API_SHA.zip" \
            "$HOST_CONTAINER:/tmp/lvis-plugin-ep-$EP_API_SHA.zip"

      - name: Run Host candidate to completion
        run: docker start --attach "$HOST_CONTAINER"

      - name: Capture Host candidate diagnostics (failure)
        id: capture-host-candidate-diagnostics
        if: failure()
        run: |
          set -euo pipefail
          if docker cp "$HOST_CONTAINER:/workspace/lvis-app/test-results" candidate-diagnostics-raw; then
            if node control/scripts/sanitize-candidate-diagnostics.mjs \
              candidate-diagnostics-raw \
              candidate-diagnostics-safe; then
              echo "diagnostics_safe=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Host candidate diagnostics were rejected by the trusted sanitizer"
              echo "diagnostics_safe=false" >> "$GITHUB_OUTPUT"
            fi
          else
            mkdir -p candidate-diagnostics-safe
            echo "no Playwright result directory" > candidate-diagnostics-safe/README.txt
            echo "diagnostics_safe=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Host candidate diagnostics (failure)
        if: failure() && steps.capture-host-candidate-diagnostics.outputs.diagnostics_safe == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketplace-host-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-diagnostics-safe/
          if-no-files-found: error
          retention-days: 14

      - name: Stop candidates before trusted evidence validation
        run: |
          set -euo pipefail
          docker stop "$MARKETPLACE_CONTAINER"
          mkdir -p candidate-evidence
          docker cp \
            "$HOST_CONTAINER:/evidence/marketplace-live-lifecycle-evidence.json" \
            candidate-evidence/marketplace-live-lifecycle-evidence.json

      - name: Validate nonce-bound evidence with trusted control
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p validated
          node control/scripts/marketplace-e2e-control.mjs finalize-evidence \
            --workflow-sha "$WORKFLOW_SHA" \
            --host-sha "$HOST_SHA" \
            --marketplace-sha "$MARKETPLACE_SHA" \
            --sdk-sha "$SDK_SHA" \
            --ep-api-sha "$EP_API_SHA" \
            --manifest inputs/input-manifest.json \
            --marketplace-manifest outputs/marketplace/marketplace-image-manifest.json \
            --marketplace-artifact outputs/marketplace/marketplace-image.tar \
            --ep-manifest outputs/ep/ep-bundle-manifest.json \
            --ep-artifact "outputs/ep/lvis-plugin-ep-$EP_API_SHA.zip" \
            --candidate-evidence-root candidate-evidence \
            --candidate-evidence candidate-evidence/marketplace-live-lifecycle-evidence.json \
            --output validated/final-evidence.json
          cp inputs/input-manifest.json \
            outputs/marketplace/marketplace-image-manifest.json \
            outputs/ep/ep-bundle-manifest.json \
            validated/

      - name: Upload trusted lifecycle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketplace-live-lifecycle-evidence-${{ github.sha }}
          path: validated/final-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Dump isolated Marketplace log (always)
        if: always()
        run: docker logs "$MARKETPLACE_CONTAINER" 2>&1 | tail -200 || true

      - name: Remove isolated candidates and network (always)
        if: always()
        run: |
          docker rm -f "$HOST_CONTAINER" >/dev/null 2>&1 || true
          docker rm -f "$MARKETPLACE_CONTAINER" >/dev/null 2>&1 || true
          docker network rm "$NETWORK_NAME" >/dev/null 2>&1 || true
